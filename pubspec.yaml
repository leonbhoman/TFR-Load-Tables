name: load_tables
description: "A new Flutter project."
publish_to: 'none'

version: 1.7.1+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  url_launcher: ^6.3.2
  crypto: ^3.0.3
  pdf: ^3.10.8
  qr_flutter: ^4.1.0
  share_plus: ^13.2.0
  path_provider: ^2.1.1
  universal_html: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/test_data.json

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
